<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskCatch Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: transparent;
      color: #0f172a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphism widget container */
    .widget-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 20px;
      box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-color-scheme: dark) {
      .widget-container {
        background: rgba(15, 23, 42, 0.90);
        border: 1px solid rgba(51, 65, 85, 0.7);
        color: #f8fafc;
      }
    }

    /* Draggable Window Bar */
    .title-bar {
      -webkit-app-region: drag;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    @media (prefers-color-scheme: dark) {
      .title-bar {
        border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      }
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .status-dot.recording {
      background: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .btn-icon {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.65;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      opacity: 1;
      background: rgba(148, 163, 184, 0.2);
    }

    /* Reminder Countdown Banner */
    .reminder-banner {
      padding: 6px 12px;
      background: rgba(99, 102, 241, 0.12);
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
      font-size: 10.5px;
      color: #4f46e5;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (prefers-color-scheme: dark) {
      .reminder-banner {
        color: #a5b4fc;
      }
    }

    /* Tasks list */
    .tasks-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-card {
      padding: 7px 9px;
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.8);
      border: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      transition: all 0.15s;
    }

    @media (prefers-color-scheme: dark) {
      .task-card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.6);
      }
    }

    .task-check {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-check:hover {
      border-color: #10b981;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .task-time {
      font-size: 9.5px;
      font-family: monospace;
      color: #64748b;
      flex-shrink: 0;
    }

    .priority-badge {
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .priority-urgent { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .priority-high { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .priority-med { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
    .priority-low { background: rgba(100, 116, 139, 0.15); color: #64748b; }

    /* Action bar */
    .action-bar {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid rgba(226, 232, 240, 0.6);
      background: rgba(241, 245, 249, 0.5);
    }

    @media (prefers-color-scheme: dark) {
      .action-bar {
        border-top: 1px solid rgba(51, 65, 85, 0.6);
        background: rgba(15, 23, 42, 0.6);
      }
    }

    .btn-record {
      flex: 1;
      height: 32px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
    }

    .btn-record.recording {
      background: #ef4444;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
      animation: pulse 1.2s infinite;
    }

    .btn-record:hover {
      filter: brightness(1.1);
    }

    .btn-bookmark {
      height: 32px;
      padding: 0 10px;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-bookmark:hover {
      background: rgba(245, 158, 11, 0.25);
    }

    /* Compact Pill Mode */
    .pill-mode {
      height: 52px;
      border-radius: 26px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
    }

    .pill-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .pill-title {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }
  </style>
</head>
<body>
  <!-- Full Mode View -->
  <div id="fullView" class="widget-container">
    <div class="title-bar">
      <div class="title-left">
        <div id="statusDot" class="status-dot"></div>
        <span>TASKCATCH</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;" class="no-drag">
        <button id="btnPill" class="btn-icon" title="Collapse to Pill">▫</button>
        <button id="btnOpacity" class="btn-icon" title="Toggle Opacity">◐</button>
        <button id="btnClose" class="btn-icon" title="Hide to Tray">✕</button>
      </div>
    </div>

    <div id="reminderBanner" class="reminder-banner">
      <span id="reminderText">Next reminder in 24m</span>
      <span id="activeCount" style="font-family: monospace;">3 pending</span>
    </div>

    <div id="tasksList" class="tasks-list">
      <!-- Injected dynamically -->
      <div style="text-align: center; color: #94a3b8; font-size: 11px; padding: 24px 0;">
        Loading tasks...
      </div>
    </div>

    <div class="action-bar no-drag">
      <button id="btnRecord" class="btn-record">
        <span>●</span>
        <span id="recordLabel">Record Call</span>
      </button>
      <button id="btnBookmark" class="btn-bookmark" title="Bookmark Moment">
        <span>★</span>
        <span>Bookmark</span>
      </button>
    </div>
  </div>

  <!-- Pill Mode View (hidden by default) -->
  <div id="pillView" class="widget-container pill-mode" style="display: none;">
    <div class="pill-left">
      <div id="pillDot" class="status-dot"></div>
      <span id="pillTaskTitle" class="pill-title">No upcoming tasks</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;" class="no-drag">
      <button id="btnPillRecord" class="btn-icon" style="font-size: 14px; color: #ef4444;" title="Record">●</button>
      <button id="btnExpand" class="btn-icon" title="Expand Widget">⤢</button>
    </div>
  </div>

  <script>
    const fullView = document.getElementById("fullView");
    const pillView = document.getElementById("pillView");
    const tasksList = document.getElementById("tasksList");
    const reminderText = document.getElementById("reminderText");
    const activeCount = document.getElementById("activeCount");
    const statusDot = document.getElementById("statusDot");
    const pillDot = document.getElementById("pillDot");
    const recordLabel = document.getElementById("recordLabel");
    const btnRecord = document.getElementById("btnRecord");
    const btnPillRecord = document.getElementById("btnPillRecord");
    const btnBookmark = document.getElementById("btnBookmark");
    const btnPill = document.getElementById("btnPill");
    const btnExpand = document.getElementById("btnExpand");
    const btnOpacity = document.getElementById("btnOpacity");
    const btnClose = document.getElementById("btnClose");
    const pillTaskTitle = document.getElementById("pillTaskTitle");

    let isRecording = false;
    let isPill = false;
    let currentOpacity = 0.95;

    async function init() {
      if (!window.electronAPI) return;

      const cfg = await window.electronAPI.getConfig();
      if (cfg) {
        currentOpacity = cfg.opacity || 0.95;
        if (cfg.isPill) togglePillMode(true);
      }

      loadTasks();

      // Electron event listeners
      window.electronAPI.onRecordingStateChanged((state) => {
        isRecording = state.isRecording;
        updateRecordingUI(state.isRecording);
      });

      window.electronAPI.onTasksChanged(() => {
        loadTasks();
      });

      window.electronAPI.onReminderFired((rem) => {
        loadTasks();
      });
    }

    async function loadTasks() {
      if (!window.electronAPI) return;
      const tasks = await window.electronAPI.getTasks();
      renderTasks(tasks || []);
    }

    function renderTasks(tasks) {
      if (!tasks || tasks.length === 0) {
        tasksList.innerHTML = `
          <div style="text-align: center; color: #94a3b8; font-size: 11px; padding: 32px 0;">
            All clear! No pending tasks.
          </div>
        `;
        reminderText.textContent = "All tasks complete";
        activeCount.textContent = "0 active";
        pillTaskTitle.textContent = "All tasks done";
        return;
      }

      activeCount.textContent = `${tasks.length} active`;
      pillTaskTitle.textContent = tasks[0]?.title || "Tasks active";

      if (tasks[0]?.due_at) {
        const due = new Date(tasks[0].due_at);
        const mins = Math.max(0, Math.round((due.getTime() - Date.now()) / 60000));
        reminderText.textContent = mins > 0 ? `Next due in ${mins}m` : "Task overdue";
      } else {
        reminderText.textContent = "Focus on next task";
      }

      tasksList.innerHTML = tasks.map(t => {
        const dueStr = t.due_at ? new Date(t.due_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        return `
          <div class="task-card">
            <div class="task-check no-drag" onclick="completeTask('${t.id}')">✓</div>
            <div class="task-text" title="${t.description || t.title}">${t.title}</div>
            <span class="priority-badge priority-${t.priority || 'med'}">${t.priority || 'med'}</span>
            ${dueStr ? `<span class="task-time">${dueStr}</span>` : ''}
          </div>
        `;
      }).join("");
    }

    async function completeTask(id) {
      if (!window.electronAPI) return;
      await window.electronAPI.markTaskDone(id);
      loadTasks();
    }

    function updateRecordingUI(recording) {
      if (recording) {
        statusDot.classList.add("recording");
        pillDot.classList.add("recording");
        btnRecord.classList.add("recording");
        recordLabel.textContent = "Stop Recording";
        btnPillRecord.textContent = "◼";
      } else {
        statusDot.classList.remove("recording");
        pillDot.classList.remove("recording");
        btnRecord.classList.remove("recording");
        recordLabel.textContent = "Record Call";
        btnPillRecord.textContent = "●";
      }
    }

    function togglePillMode(pill) {
      isPill = pill;
      if (isPill) {
        fullView.style.display = "none";
        pillView.style.display = "flex";
      } else {
        fullView.style.display = "flex";
        pillView.style.display = "none";
      }
      if (window.electronAPI) {
        window.electronAPI.setCollapsed(isPill);
      }
    }

    // Button event handlers
    btnRecord.addEventListener("click", () => window.electronAPI?.toggleRecording());
    btnPillRecord.addEventListener("click", () => window.electronAPI?.toggleRecording());
    btnBookmark.addEventListener("click", () => window.electronAPI?.addBookmark());
    btnPill.addEventListener("click", () => togglePillMode(true));
    btnExpand.addEventListener("click", () => togglePillMode(false));
    btnClose.addEventListener("click", () => window.electronAPI?.closeWidget());

    btnOpacity.addEventListener("click", () => {
      currentOpacity = currentOpacity <= 0.65 ? 0.95 : currentOpacity - 0.15;
      window.electronAPI?.setOpacity(currentOpacity);
    });

    init();
  </script>
</body>
</html>
